<!doctype html>
<!-- EP001 seg02 (今日の全体像) — givemotion composition, 19.67s local. Master table: 08_timestamps.json.
     Background/coin/paper texture are 3D-scene renders (same-source rule). SFX cues archived, not used. -->
<html data-width="1920" data-height="1080" data-fps="30">
<head><meta charset="utf-8"><style>
@font-face{ font-family:"BIZ UDPGothic"; src:url(assets/fonts/BIZUDPGothic-Regular.ttf) format("truetype"); font-weight:400; }
@font-face{ font-family:"BIZ UDPGothic"; src:url(assets/fonts/BIZUDPGothic-Bold.ttf) format("truetype"); font-weight:700 900; }
:root{
  --bg:#efe6d0; --card:#f8f2e2; --ink:#2e2a26; --muted:#6b6156;
  --green:#1f4d3a; --green-mid:#2e6b4f; --gold:#c29b3c; --gold-pale:#e7cc7e; --gold-deep:#9a7a2a;
  --track:#e2d5b8; --warn:#a63d2f;
  --sans:"BIZ UDPGothic","Noto Sans CJK JP",sans-serif;
  --serif:"BIZ UDPGothic","Noto Sans CJK JP",sans-serif;
}
*{ box-sizing:border-box; }
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); margin:0; overflow:hidden; }
.scene{ position:relative; width:1920px; height:1080px; }
/* L0: the channel's one paper ground — a 3D render of the same ground, softened behind data */
.bgimg{ position:absolute; inset:-30px; z-index:0; background:url(assets/ground-top.png) center/cover no-repeat;
        filter:blur(6px) contrast(.93) brightness(1.0) saturate(1.02); }
.veil{ position:absolute; inset:0; z-index:1; background:rgba(239,230,208,.10); }
/* paper material for every card/strip: the 3D card texture under a light card tint */
.paper{ background:linear-gradient(rgba(248,242,226,.62),rgba(248,242,226,.62)), url(assets/paper-tex.png);
        background-size:auto, 512px 512px; border-radius:12px 15px 11px 16px / 15px 11px 16px 12px;
        box-shadow:4px 5px 0 -1px #e6dbc0, 8px 10px 0 -2px #d9cbab, 7px 18px 30px rgba(90,55,20,.26),
        inset 0 0 0 2px rgba(46,42,38,.20); }
.kicker{ position:absolute; left:110px; top:64px; font-size:29px; font-weight:700; letter-spacing:.3em; color:var(--gold-deep); z-index:5; }
.segtitle{ position:absolute; left:110px; top:106px; font-family:var(--serif); font-size:64px; font-weight:700; z-index:5; }
.segtitle .g{ color:var(--gold-deep); }
.headrule{ position:absolute; left:110px; top:216px; width:1700px; height:3px; background:var(--ink); opacity:.75; z-index:5;
           transform-origin:left center; animation:growx .6s ease-out .3s both; }
.stage{ position:absolute; left:110px; top:250px; width:1700px; height:600px; z-index:4; }
/* subtitles (L5): bottom, always on top; gold emphasis */
.sub{ position:absolute; left:50%; bottom:40px; transform:translateX(calc(-50% + 110px)); z-index:40;
      font-size:48px; font-weight:700; line-height:1.25; text-align:center; color:#fbf6ea;
      background:rgba(84,66,48,.55); padding:13px 30px 15px; border-radius:12px; max-width:1440px;
      text-shadow:0 1px 3px rgba(43,36,28,.45); opacity:0; white-space:nowrap; }
.sub .g{ color:#e9c979; }
.sub .gr{ color:var(--green); }
/* found real materials: scene photos in a paper frame; element cutouts as paper-ground stickers */
.pframe{ position:absolute; border:6px solid #fbf7ec; border-radius:8px; overflow:hidden;
         box-shadow:5px 6px 0 -1px #e6dbc0, 10px 20px 34px rgba(90,55,20,.32); }
.pframe img{ width:100%; height:100%; object-fit:cover; display:block; }
.pframe .credit{ position:absolute; right:10px; bottom:8px; font-size:20px; color:#fff8ea;
                 background:rgba(43,36,28,.55); padding:3px 10px; border-radius:6px; }
.cutout{ position:absolute; filter:drop-shadow(5px 10px 14px rgba(90,55,20,.35)); }
/* mini blackboard (progress map, top-right corner) */
.minibb{ position:absolute; right:56px; top:52px; width:308px; z-index:30; padding:14px 16px 10px; }
.minibb .bbt{ font-size:21px; font-weight:700; color:var(--green); letter-spacing:.12em; margin-bottom:8px; }
.minibb .bbt span{ color:var(--gold-deep); }
.minibb .chip{ display:inline-block; font-size:19px; font-weight:700; padding:3px 9px; margin:0 5px 6px 0;
               border:2px solid rgba(31,77,58,.35); color:rgba(46,42,38,.38); border-radius:4px; }
.minibb .chip.on{ background:var(--green); border-color:var(--green); color:#f8f2e2; }
.minibb .chip.on.gold{ background:var(--gold-deep); border-color:var(--gold-deep); }
.minibb .chip.new{ animation:chippop .5s ease-out both; }
/* persona watermark: small round avatar, bottom-LEFT, same spot/size in every content
   segment (sa 2026-11-28: bottom-right collides with YouTube's own watermark/player
   furniture). Subtitles (z 40) stay on top; .sub is narrowed and shifted right so its
   band leaves the bottom-left watermark corner free. */
.wm{ position:absolute; left:48px; bottom:44px; width:120px; height:120px; border-radius:50%;
     object-fit:cover; z-index:35; border:4px solid rgba(248,242,226,.92);
     box-shadow:0 8px 20px rgba(90,55,20,.30); }
/* generic content pieces */
.card{ padding:34px 40px; }
.card h3{ margin:0 0 10px; font-size:44px; font-weight:800; }
.card p{ margin:0; font-size:31px; line-height:1.55; color:var(--ink); }
.card p .g, .big .g{ color:var(--gold-deep); font-weight:800; }
.big{ font-size:120px; font-weight:800; font-variant-numeric:tabular-nums; }
table.pt{ border-collapse:collapse; width:100%; font-size:34px; }
table.pt th, table.pt td{ padding:20px 26px; text-align:left; border-bottom:3px solid rgba(46,42,38,.16); }
table.pt th{ color:var(--green); font-weight:800; white-space:nowrap; }
table.pt td.n{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
ul.rows{ list-style:none; margin:0; padding:0; }
ul.rows li{ font-size:38px; font-weight:700; padding:20px 28px; margin-bottom:16px; }
ul.rows li small{ display:block; font-size:27px; font-weight:500; color:var(--muted); margin-top:4px; }
.strip{ position:relative; height:170px; padding:0 40px; display:flex; align-items:center; }
.strip .expr{ font-size:66px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.strip .expr .x{ color:var(--muted); font-size:48px; margin:0 10px; }
.strip .track{ position:relative; flex:1; height:72px; margin-left:44px; background:var(--track); border-radius:4px; overflow:hidden; }
.strip .bar{ position:absolute; inset:0; background:linear-gradient(180deg,#cfa844,#bd9433); transform-origin:left center; }
.strip .bar.seg{ background:transparent; display:flex; gap:6px; }
.strip .bar.seg i{ flex:1; background:linear-gradient(180deg,#cfa844,#bd9433); display:block; transform-origin:left center; }
.eqtag{ font-size:50px; font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; white-space:nowrap; }
.flowrow{ display:flex; align-items:center; gap:24px; }
.fchip{ padding:22px 32px; font-size:38px; font-weight:800; text-align:center; }
.fchip small{ display:block; font-size:24px; font-weight:500; color:var(--muted); margin-top:4px; }
.conn{ flex:1; height:6px; background:linear-gradient(180deg,#dcbc6a,#c9a24a); position:relative; min-width:56px;
       border-radius:3px; filter:drop-shadow(2px 3px 3px rgba(90,55,20,.35)); }
.conn::after{ content:""; position:absolute; right:-2px; top:-9px; border-left:20px solid var(--gold);
              border-top:11px solid transparent; border-bottom:11px solid transparent; }
.mockwin{ padding:0; overflow:hidden; }
.mockwin .bar2{ background:var(--green); color:#f8f2e2; padding:16px 28px; font-size:28px; font-weight:700;
                display:flex; justify-content:space-between; }
.mockwin .bar2 .dots{ color:var(--gold-pale); letter-spacing:.3em; }
.mockwin .body{ padding:28px 34px; font-size:31px; line-height:1.6; }
.mockwin .body .lbl{ font-size:24px; font-weight:700; color:var(--gold-deep); letter-spacing:.18em; }
.check li::before{ content:"✓"; color:var(--green); font-weight:800; margin-right:14px; }
.warnmark{ color:var(--warn); font-weight:800; }
.foot{ position:absolute; left:110px; bottom:170px; font-size:28px; color:var(--muted); z-index:5; }
@keyframes fadeup{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:translateY(0); } }
@keyframes growx{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
@keyframes popin{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:scale(1); } }
@keyframes chippop{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.18); } 100%{ transform:scale(1); } }

@keyframes subseg020{ 0%,0.000%{opacity:0} 0.250%,8.529%{opacity:1} 8.729%,100%{opacity:0} }
@keyframes subseg021{ 0%,8.729%{opacity:0} 8.979%,23.608%{opacity:1} 23.808%,100%{opacity:0} }
@keyframes subseg022{ 0%,23.808%{opacity:0} 24.058%,42.657%{opacity:1} 42.857%,100%{opacity:0} }
@keyframes subseg023{ 0%,42.857%{opacity:0} 43.107%,54.564%{opacity:1} 54.764%,100%{opacity:0} }
@keyframes subseg024{ 0%,54.764%{opacity:0} 55.014%,70.435%{opacity:1} 70.635%,100%{opacity:0} }
@keyframes subseg025{ 0%,70.635%{opacity:0} 70.885%,82.342%{opacity:1} 82.542%,100%{opacity:0} }
@keyframes subseg026{ 0%,82.542%{opacity:0} 82.792%,99.800%{opacity:1} 100.000%,100%{opacity:0} }
</style></head>
<body><main data-sequence>
<section class="scene" data-duration="19.670">
  <div class="bgimg"></div><div class="veil"></div>
  <div class="kicker">EP001｜今日の全体像</div>
  <div class="segtitle">先に、正直に言います</div>
  <div class="headrule"></div>
  <div class="stage"><div class="pframe" style="right:0;top:6px;width:700px;height:394px;animation:fadeup .6s ease-out 1.0s both"><img src="assets/found/S-102_seg02_calculator-desk_1920x1080.jpg" alt=""><span class="credit">実景 Photo: Pexels</span></div><ul class="rows" style="width:960px"><li class="paper" style="animation:fadeup 0.5s ease-out 0.5s both">このチャンネルの収益は、まだ<span class="g">ゼロ</span><small>正直に、先に言います</small></li><li class="paper" style="animation:fadeup 0.5s ease-out 3.2s both">今日の数字は<span class="g">実績ではありません</span><small>目標と、シミュレーションです</small></li><li class="paper" style="animation:fadeup 0.5s ease-out 6.4s both"><span class="g">30日後</span>に結果を公開します<small>良くても、悪くても、全部です</small></li></ul></div>
  <div class="minibb paper"><div class="bbt">まとめボード <span>0/9</span></div><span class="chip" style="animation-delay:0.5s">1</span><span class="chip" style="animation-delay:0.5s">2</span><span class="chip" style="animation-delay:0.5s">3</span><span class="chip" style="animation-delay:0.5s">4</span><span class="chip" style="animation-delay:0.5s">5</span><span class="chip" style="animation-delay:0.5s">6</span><span class="chip" style="animation-delay:0.5s">7</span><span class="chip" style="animation-delay:0.5s">8</span><span class="chip" style="animation-delay:0.5s">9</span></div>
  
  <img class="wm" src="assets/avatar.webp" alt="">
  <div class="sub" style="animation:subseg020 19.670s linear both">先に、正直に言います。</div>
<div class="sub" style="animation:subseg021 19.670s linear both">このチャンネルの収益は、まだゼロです。</div>
<div class="sub" style="animation:subseg022 19.670s linear both">だから、今日出てくる数字は、実績ではありません。</div>
<div class="sub" style="animation:subseg023 19.670s linear both"><span class="g">目標</span>と、<span class="g">シミュレーション</span>です。</div>
<div class="sub" style="animation:subseg024 19.670s linear both">その代わり、<span class="g">30日</span>後に結果を公開します。</div>
<div class="sub" style="animation:subseg025 19.670s linear both">良くても、悪くても、全部です。</div>
<div class="sub" style="animation:subseg026 19.670s linear both">うまくいった話だけを切り取ることはしません。</div>
</section></main></body></html>
