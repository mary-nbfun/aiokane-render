<!doctype html>
<!--
  AIとお金の実践室 Shorts 样片 v1 — givemotion
  Look: deep navy (#0d183f→#16265e), teal accent (#2ec4b6), restrained gold (#f0c64f), sprout green.
  Type: Noto Sans CJK JP bold headlines, large whole-sentence captions (no voice-over in this test).
  Shot list (1080x1920, 30fps, safe-zone shorts):
    1 Hook 6s   AI副業で月1万円の「目標」を作る 3ステップ (+目標/シミュレーション注記)
    2 Step1 7s  ChatGPTで小さな仕事を1件作る
    3 Step2 7s  月1万円を目標に逆算 (5,000円×2件 / 2,500円×4件 = シミュレーション)
    4 Step3 7s  新NISAのつみたて枠へ回す
    5 End  7s   avatar + AIとお金の実践室 + 免責 (収益は保証されません/投資助言ではありません)
  Transitions push-up 0.6 x4 -> total = 34 - 2.4 = 31.6s
-->
<html data-width="1080" data-height="1920" data-fps="30" data-safe-zone="shorts">
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy:#0d183f; --navy2:#16265e; --teal:#2ec4b6; --teal-d:#178f7f;
    --gold:#f0c64f; --ink:#f5f7fc; --muted:#aeb9d6;
  }
  body{
    background: radial-gradient(130% 90% at 50% 0%, var(--navy2) 0%, var(--navy) 58%, #08102c 100%);
    color:var(--ink);
    font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN",Inter,system-ui,sans-serif;
  }
  .scene{ display:grid; place-items:center; padding:300px 84px 400px; }
  .stack{ display:flex; flex-direction:column; align-items:center; gap:34px; text-align:center; width:100%; }
  .glow{ position:absolute; width:1000px; height:1000px; border-radius:50%;
         background:radial-gradient(closest-side, #2ec4b633, transparent); animation: breathe 3.2s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(.92); opacity:.75; } to { transform: scale(1.08); opacity:1; } }
  .kicker{ font-size:38px; font-weight:700; letter-spacing:.28em; color:var(--teal); }
  .kicker .gold{ color:var(--gold); }
  h1{ margin:0; font-size:118px; line-height:1.22; font-weight:900; letter-spacing:.01em; }
  h1 .t{ color:var(--teal); } h1 .g{ color:var(--gold); }
  h2{ margin:0; font-size:104px; line-height:1.25; font-weight:900; }
  h2 .t{ color:var(--teal); } h2 .g{ color:var(--gold); }
  .note{ font-size:40px; line-height:1.5; color:var(--muted); font-weight:500; }
  .note b{ color:var(--ink); font-weight:700; }
  .stepno{ display:flex; align-items:center; gap:22px; font-size:44px; font-weight:900; letter-spacing:.22em; color:var(--gold); }
  .stepno::before,.stepno::after{ content:""; width:64px; height:4px; background:var(--teal); border-radius:2px; }
  .card{ width:100%; box-sizing:border-box; padding:38px 44px; border-radius:28px;
         background:#ffffff10; border:2px solid #2ec4b655; text-align:center; }
  .card .row{ font-size:56px; font-weight:900; line-height:1.5; font-variant-numeric:tabular-nums; }
  .card .row .t{ color:var(--teal); }
  .card .lbl{ font-size:36px; color:var(--muted); margin-top:10px; }
  .avatar{ width:340px; height:340px; border-radius:50%; object-fit:cover;
           border:6px solid #2ec4b6aa; box-shadow:0 24px 70px #0009; }
  .chname{ font-size:76px; font-weight:900; line-height:1.3; }
  .chsub{ font-size:42px; color:var(--teal); font-weight:700; letter-spacing:.12em; }
  .disc{ font-size:34px; line-height:1.6; color:var(--muted); max-width:820px; }
  .bar{ width:120px; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--teal),var(--gold)); }
</style>
</head>
<body>
  <main data-sequence data-transition="push-up 0.6">

    <section class="scene" data-duration="6" data-camera="push 1.13">
      <div class="glow"></div>
      <div class="stack">
        <div class="kicker">AI副業 <span class="gold">×</span> 新NISA</div>
        <h1 data-split="lines" data-enter="rise 0.8 0.05" data-stagger="0.12">AI副業で<br>月<span class="g">1万円</span>の<br>「<span class="t">目標</span>」を作る<br><span class="t">3</span>ステップ</h1>
        <div class="bar" data-enter="fade 0.6 0.9"></div>
        <p class="note" data-enter="fade-up 0.7 1.0">金額はすべて<b>目標／シミュレーション</b>です</p>
      </div>
    </section>

    <section class="scene" data-duration="6.5" data-camera="push 1.13">
      <div class="glow"></div>
      <div class="stack">
        <div class="stepno" data-enter="fade-up 0.5">STEP 1</div>
        <h2 data-enter="rise 0.8 0.15"><span class="t">ChatGPT</span>で<br>小さな仕事を<br><span class="g">1件</span>作る</h2>
        <p class="note" data-enter="fade-up 0.7 0.8">まずは小さく。<br>完璧より、<b>最初の一件</b>。</p>
      </div>
    </section>

    <section class="scene" data-duration="6.5" data-camera="push 1.13">
      <div class="glow"></div>
      <div class="stack">
        <div class="stepno" data-enter="fade-up 0.5">STEP 2</div>
        <h2 data-enter="rise 0.8 0.15">月<span class="g">1万円</span>を<br>目標に<span class="t">逆算</span></h2>
        <div class="card" data-enter="pop 0.7 0.7">
          <div class="row"><span class="t">5,000円</span> × 2件</div>
          <div class="row"><span class="t">2,500円</span> × 4件</div>
          <div class="lbl">※ 目標のシミュレーションです</div>
        </div>
      </div>
    </section>

    <section class="scene" data-duration="6.5" data-camera="push 1.13">
      <div class="glow"></div>
      <div class="stack">
        <div class="stepno" data-enter="fade-up 0.5">STEP 3</div>
        <h2 data-check="orphan-ok" data-enter="rise 0.8 0.15">新NISAの<br><span class="t">つみたて枠</span>へ<br>回す</h2>
        <p class="note" data-enter="fade-up 0.7 0.8">作った分を、<b>習慣</b>に変える。<br>少額から、続ける仕組みに。</p>
      </div>
    </section>

    <section class="scene" data-duration="6.5" data-camera="push 1.12">
      <div class="glow"></div>
      <div class="stack">
        <img class="avatar" src="avatar.webp" alt="" data-enter="pop 0.8 0.1">
        <div class="chname" data-enter="fade-up 0.7 0.5">AIとお金の実践室</div>
        <div class="chsub" data-enter="fade-up 0.7 0.7">ケイと一緒に、実務から。</div>
        <p class="disc" data-enter="fade-up 0.7 1.0">収益は保証されません。<br>本動画は投資助言ではありません。</p>
      </div>
    </section>

  </main>
</body>
</html>
