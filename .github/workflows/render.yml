name: render

# Build & release pipeline for THIS repository's own video sources
# (HTML/CSS compositions -> MP4). Usage kept proportionate per GitHub's
# additional product terms: native render is 1080p only (the "4K" file is
# a plain ffmpeg upscale, not a frame render), no unrelated downloads,
# no daemons or outward services, artifacts retained 7 days.

on:
  workflow_dispatch:
    inputs:
      quality:
        description: givemotion render quality
        type: choice
        options: [draft, standard, high, max]
        default: standard
  push:
    branches: [main]
    paths:
      - 'shorts-v1/**'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ffmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install givemotion Chrome and check environment
        run: |
          npx -y givemotion@0.1.6 install
          npx -y givemotion@0.1.6 doctor

      - name: Restore givemotion segment cache
        uses: actions/cache@v4
        with:
          path: .gm-cache
          key: gm-cache-${{ hashFiles('shorts-v1/index.html') }}
          restore-keys: |
            gm-cache-

      - name: Snapshot (keyframe sheet)
        run: npx -y givemotion@0.1.6 snapshot shorts-v1/index.html

      - name: Render 1080x1920 master
        run: |
          mkdir -p out
          npx -y givemotion@0.1.6 render shorts-v1/index.html -o out/video.mp4 \
            --quality ${{ inputs.quality || 'standard' }} \
            --cache-dir .gm-cache --json

      - name: Upscale to 2160x3840 upload copy (lanczos)
        run: |
          ffmpeg -y -i out/video.mp4 \
            -vf scale=2160:3840:flags=lanczos \
            -c:v libx264 -crf 16 -preset medium -pix_fmt yuv420p \
            out/video-4k.mp4

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            out/video.mp4
            out/video-4k.mp4
            shorts-v1/snapshots/sheet.png
          retention-days: 7
