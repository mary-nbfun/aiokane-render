name: paper-render

# Papercraft 3D segments (title + board) rendered on the runner's headless Chrome (SwiftShader WebGL).
# Kept separate from the givemotion 2D workflows (render.yml / render-matrix.yml): this one only
# touches paper/ and uploads its MP4s as artifacts.
on:
  workflow_dispatch:

jobs:
  still:
    name: verify one still first
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allow Chrome sandbox on ubuntu-24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install CJK font (the scene prints Japanese text)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install vendored BIZ UDPGothic (main font; Noto stays as fallback)
        run: |
          mkdir -p ~/.fonts
          cp paper/fonts/BIZUDPGothic-Regular.ttf paper/fonts/BIZUDPGothic-Bold.ttf ~/.fonts/
          fc-cache -f
          fc-match "BIZ UDPGothic"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: One still of the title segment (t=3.2s)
        run: |
          time python paper/tools/render_ci.py still title 3.2 paper/frames/check.png
      - name: One still of the boardfull segment (t=4.5s, font check on board nodes)
        run: |
          time python paper/tools/render_ci.py still boardfull 4.5 paper/frames/check-boardfull.png
      - uses: actions/upload-artifact@v4
        with:
          name: paper-still
          path: paper/frames/check*.png
          retention-days: 7

  render:
    name: render segment
    needs: still
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - seg: title
            dur: '6.2'
          - seg: boardfull
            dur: '5.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allow Chrome sandbox on ubuntu-24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install CJK font (the scene prints Japanese text)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install vendored BIZ UDPGothic (main font; Noto stays as fallback)
        run: |
          mkdir -p ~/.fonts
          cp paper/fonts/BIZUDPGothic-Regular.ttf paper/fonts/BIZUDPGothic-Bold.ttf ~/.fonts/
          fc-cache -f
          fc-match "BIZ UDPGothic"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Render segment ${{ matrix.seg }} (${{ matrix.dur }}s @30fps, 1080p)
        run: |
          time timeout 1500 python paper/tools/render_ci.py video ${{ matrix.seg }} ${{ matrix.dur }} paper/frames/seg-${{ matrix.seg }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: paper-seg-${{ matrix.seg }}
          path: paper/frames/seg-${{ matrix.seg }}.mp4
          retention-days: 7
