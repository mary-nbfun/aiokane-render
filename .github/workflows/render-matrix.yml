name: render-matrix (experimental)

# Experimental: split the composition into 2 time ranges with givemotion
# --frames, render them in parallel matrix jobs, then concat with ffmpeg
# and verify duration/frame count against the known full render
# (29.6s / 888 frames). Not the production route until verified.
# Usage restraint: segment matrix is capped at 4 parallel jobs by design
# (currently 2); artifacts retained 7 days; build-only, nothing else.

on:
  workflow_dispatch:
    inputs:
      quality:
        description: givemotion render quality
        type: choice
        options: [draft, standard, high, max]
        default: standard

jobs:
  segment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: seg1, frames: '0s-14.8s' }
          - { name: seg2, frames: '14.8s-29.6s' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Allow Chrome sandbox on Ubuntu 24.04 (AppArmor userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install ffmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install givemotion Chrome
        run: npx -y givemotion@0.1.6 install

      - name: Render segment ${{ matrix.part.name }}
        run: |
          mkdir -p out-seg
          npx -y givemotion@0.1.6 render shorts-v1/index.html \
            -o out-seg/${{ matrix.part.name }}.mp4 \
            --frames '${{ matrix.part.frames }}' \
            --quality ${{ inputs.quality || 'standard' }} --json

      - name: Upload segment
        uses: actions/upload-artifact@v4
        with:
          name: segment-${{ matrix.part.name }}
          path: out-seg/${{ matrix.part.name }}.mp4
          retention-days: 7

  merge:
    needs: segment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: segment-*
          path: segs
          merge-multiple: true

      - name: Concat segments
        run: |
          ls -la segs
          printf "file '%s'\n" "$PWD/segs/seg1.mp4" > list.txt
          printf "file '%s'\n" "$PWD/segs/seg2.mp4" >> list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt \
            -c:v libx264 -crf 18 -pix_fmt yuv420p merged.mp4

      - name: Verify merged output (expect ~29.6s / 888 frames)
        run: |
          ffprobe -v error -count_frames \
            -show_entries format=duration \
            -show_entries stream=width,height,r_frame_rate,nb_read_frames \
            -of default=noprint_wrappers=1 merged.mp4

      - name: Upload merged
        uses: actions/upload-artifact@v4
        with:
          name: merged-video
          path: merged.mp4
          retention-days: 7
